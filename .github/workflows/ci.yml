name: Validate Apex Moto
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx expo-doctor
      - run: node scripts/verify-native-config.mjs
      - run: npm run build
      - run: npm run build:native
      - uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: dist
          retention-days: 7
